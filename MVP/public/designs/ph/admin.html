<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/designs/ph/glider.svg" type="image/svg+xml"><link rel="preload" href="/designs/ph/fonts/PixelHackers.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="/contract.css"><link rel="stylesheet" href="/designs/ph/ph.css"><title>Host | Checkpoints</title></head>
<body data-page="admin" data-live="no">
<header class="top"><a class="glider" href="/" aria-label="Checkpoints home"><svg viewBox="0 0 1815 1816" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M723.58 1458.25H357.555V1092.02H723.58V1458.25ZM1089.6 725.795H1455.63V1458.25H1089.6V1092.02H723.58V359.568H1089.6V725.795Z"/></svg><b>Checkpoints host</b></a><nav><a class="nav-link" href="/" target="_blank">Present</a><a class="nav-link" href="/view" target="_blank">Watch</a><a class="nav-link" href="/recordings" target="_blank">Recordings</a></nav></header>
<main class="admin">
  <section class="stage">
    <div class="idle-only"><b>Nobody live</b><span class="up">Press next person to call someone up</span></div>
    <span class="live-only live-tag">On air</span>
    <video id="stageVideo" autoplay playsinline muted></video>
  </section>
  <section class="control">
    <p class="kicker">On stage &middot; <span id="nowStatus">idle</span></p>
    <h2 id="nowName">Nobody on stage</h2>
    <p id="nowNote"></p>
    <div class="clock"><span id="stopwatch">00:00</span><label class="limit">Limit <input id="limitInput" type="number" min="1" max="30" value="5"> min</label></div>
    <div class="ctl-btns">
      <button class="pxbtn wide" id="nextBtn" type="button">Next person</button>
      <button class="pxbtn pink" id="stopBtn" type="button">Stop sharing</button>
      <button id="soundBtn" type="button">Turn sound on</button>
    </div>
  </section>
  <section class="qcard dark">
    <div class="qhead"><h2>Queue (<span id="count">0</span>)</h2><a class="textbtn" href="/recordings" target="_blank">Recordings</a></div>
    <ol id="queueList" class="queue" aria-label="Demo queue"></ol>
  </section>
</main>
<script src="/designs/ph/ph.js" type="module"></script><script src="/core.js" type="module"></script></body></html>
