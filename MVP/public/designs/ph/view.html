<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/designs/ph/glider.svg" type="image/svg+xml"><link rel="preload" href="/designs/ph/fonts/PixelHackers.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="/contract.css"><link rel="stylesheet" href="/designs/ph/ph.css"><title>Watch | Checkpoints</title></head>
<body data-page="view" data-live="no">
<main>
<section class="stage">
  <div class="idle-only idle-scene">
    <div class="grid-bg" aria-hidden="true"></div>
    <div class="life" aria-hidden="true" style="color:#000" data-rows="40" data-dither="24"></div>
    <div>
      <h1>Check<br>points</h1>
      <p class="lede up">A collective of <span class="c-pink">hobbyists</span>, <span class="c-violet">engineers</span>, and <span class="c-blue">artists</span> showing what they made tonight.</p>
      <p class="join-at">Join the queue at <span data-join-url="/">/</span></p>
    </div>
    <div class="upnext-card"><h3>Up next</h3><p class="kicker"><span id="count">0</span> in line</p><ol id="upNext" class="queue"></ol></div>
  </div>
  <video id="stageVideo" autoplay playsinline muted></video>
  <div class="live-only lower-third"><span class="live-tag"><span id="nowStatus">live</span></span><b id="nowName"></b><span id="nowNote"></span><span id="stopwatch">00:00</span></div>
  <div class="view-ctl"><button id="soundBtn" type="button">Turn sound on</button><button id="fsBtn" type="button">Fullscreen (F)</button></div>
</section>
</main>
<script src="/designs/ph/ph.js" type="module"></script><script src="/core.js" type="module"></script></body></html>
