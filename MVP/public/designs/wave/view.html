<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050507"><link rel="icon" href="/logo.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Doto:wght@400..900&family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet"><link rel="stylesheet" href="/contract.css"><link rel="stylesheet" href="/designs/wave/wave.css"><title>Watch | Checkpoints</title></head>
<body data-page="view" data-live="no">
<header class="top"><a class="brand" href="/d/wave/join"><svg class="mark" viewBox="0 0 72 72" aria-hidden="true"><path d="M24 72H0V48H24V72ZM72 72H48V48H24V0H48V24H72V72Z" fill="currentColor"/></svg><b>checkpoints</b><small>by Purdue Hackers</small></a><nav><a href="/d/wave/join">Present</a><a href="/d/wave/view" aria-current="page">Watch</a><a href="/d/wave/recordings">Recordings</a><a href="/">All designs</a></nav></header>
<main class="stage proj">
  <div class="idle-scene idle-only">
    <div class="field" style="position:absolute" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><canvas class="waves" data-dense="1"></canvas><div class="grain"></div></div>
    <div class="proj-top"><span class="chip"><span class="dot"></span>Hack Night &middot; <span id="nowStatus">idle</span></span></div>
    <div class="idle-copy">
      <div class="idle-left">
        <p><b id="nowName">Nobody on stage</b> &mdash; <span id="nowNote"></span></p>
        <h1 class="wordmark">check<span>points</span></h1>
      </div>
      <div class="panel upnext-card">
        <p class="kicker">Up next &middot; <span id="count">0</span> in line</p>
        <ol id="upNext" class="queue"></ol>
      </div>
    </div>
  </div>
  <video id="stageVideo" autoplay playsinline muted></video>
  <div class="live-only now-tag"><p class="kicker"><span class="dot live"></span><span data-mirror="nowStatus">live</span></p><h2 data-mirror="nowName"></h2><p class="note" data-mirror="nowNote"></p></div>
  <div class="proj-ctl"><button class="btn floating" id="soundBtn" type="button">Turn sound on</button><button class="btn floating" id="fsBtn" type="button" title="Fullscreen (F)">Fullscreen <kbd>F</kbd></button></div>
</main>
<script>
  // Mirror name/note into the live corner tag (core.js writes the ids in the idle scene).
  const mirror = () => document.querySelectorAll('[data-mirror]').forEach((el) => { el.textContent = document.getElementById(el.dataset.mirror).textContent; });
  new MutationObserver(mirror).observe(document.querySelector('.idle-scene'), { subtree: true, childList: true, characterData: true });
</script>
<script src="/designs/wave/wave.js" type="module"></script>
<script src="/core.js" type="module"></script></body></html>
