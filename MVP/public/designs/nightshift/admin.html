<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Host · Nightshift · Checkpoints</title>
<link rel="icon" href="/designs/nightshift/moon.svg">
<link rel="stylesheet" href="/contract.css">
<link rel="stylesheet" href="/designs/nightshift/nightshift.css">
<link rel="stylesheet" href="/designs/nightshift/pages.css">
</head>
<body data-page="admin">
<header class="bar">
  <a class="brand" href="/d/nightshift/view"><img class="mark" src="/designs/nightshift/moon.svg" alt=""><span class="word"><b>NIGHTSHIFT</b><small>PURDUE HACKERS</small></span></a>
  <nav class="nav">
    <a href="/d/nightshift/join">Present</a>
    <a href="/d/nightshift/view">Watch</a>
    <a href="/d/nightshift/recordings">Recordings</a>
    <a href="/d/nightshift/admin" class="on">Host</a>
    <a href="/">All designs</a>
  </nav>
</header>
<main class="host">
  <section class="hostmain">
    <div class="stage main-stage">
      <video id="stageVideo" autoplay playsinline muted></video>
      <div class="idle idle-only">
        <div class="photo"></div><div class="sky"></div><div class="aurora"></div><div class="grid"></div>
        <div class="copy left"><p class="eyebrow gold">Control room</p><h1 class="serif">Stage is <em>clear</em>.</h1><p>Press Next to call the first person up.</p></div>
      </div>
      <div class="lower live-only"><div class="tag"><span class="pill live"><span class="dot"></span>Live</span><div><b>On the projector</b><span>Everyone watching sees this.</span></div></div></div>
      <button class="btn sound live-only" id="soundBtn" type="button">Turn sound on</button>
    </div>
    <div class="card nowcard">
      <div class="nowinfo">
        <p class="eyebrow gold">On stage · <span id="nowStatus">idle</span></p>
        <b id="nowName">Nobody on stage</b>
        <span id="nowNote"></span>
      </div>
      <div class="controls">
        <button class="btn gold big" id="nextBtn" type="button">Next presenter &rarr;</button>
        <button class="btn danger big" id="stopBtn" type="button">Stop sharing</button>
      </div>
    </div>
  </section>
  <aside class="rail">
    <section class="card clockcard">
      <p class="eyebrow gold">Demo clock</p>
      <div class="bigclock"><span id="stopwatch" data-state="idle">00:00</span></div>
      <div class="legend"><span class="k ok"></span>on time <span class="k warn"></span>wrap up <span class="k over"></span>over</div>
      <label class="limit"><span>Time limit</span><input id="limitInput" type="number" min="1" max="60" value="5"><span>min</span></label>
    </section>
    <section class="card side fill">
      <div class="sidehead"><h3>Queue</h3><span class="countchip"><b id="count">0</b> waiting</span></div>
      <ol id="queueList" class="queue"></ol>
    </section>
  </aside>
</main>
<script src="/core.js" type="module"></script>
</body>
</html>
